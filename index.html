<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتحاد ویلفیئر فاؤنڈیشن - بستی بلوچاں والی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Noto Naskh Arabic', serif; background-color: #f0f2f5; }
        .tab-btn.active { color: #15803d; border-bottom: 3px solid #15803d; }
    </style>
</head>
<body class="text-gray-900 pb-12">

    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between h-14">
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="bg-green-700 text-white p-2 rounded-full w-9 h-9 flex items-center justify-center font-bold text-lg shadow">ا</div>
                <div>
                    <h1 class="text-base font-bold text-green-800 leading-tight">اتحاد ویلفیئر فاؤنڈیشن</h1>
                    <p class="text-[10px] text-gray-500">بستی بلوچاں والی کمیٹی</p>
                </div>
            </div>
            <button onclick="switchTab('posts')" class="bg-green-700 text-white px-3 py-1.5 rounded-full text-xs font-semibold shadow">
                <i class="fa-solid fa-pen ml-1"></i> پوسٹ کریں
            </button>
        </div>

        <nav class="flex justify-around bg-white border-t border-gray-200 text-gray-600 font-semibold text-sm">
            <button onclick="switchTab('posts')" id="tab-posts" class="tab-btn active py-3 flex-1 text-center">پوسٹس (Feed)</button>
            <button onclick="switchTab('about')" id="tab-about" class="tab-btn py-3 flex-1 text-center">تعارف و تصدیق</button>
            <button onclick="switchTab('rules')" id="tab-rules" class="tab-btn py-3 flex-1 text-center">اصول و ضوابط</button>
        </nav>
    </header>

    <div class="max-w-2xl mx-auto px-2 sm:px-4 mt-4">
        <!-- Posts Feed -->
        <div id="sec-posts">
            <div class="bg-white rounded-lg shadow p-4 mb-4 border border-gray-200">
                <form id="postForm" onsubmit="handlePostSubmit(event)" class="space-y-3">
                    <input type="text" id="postTitle" required placeholder="پوسٹ کرنے والے کا نام" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-1 focus:ring-green-600">
                    <textarea id="postText" rows="3" placeholder="آپ کے ذہن میں کیا ہے؟..." class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-1 focus:ring-green-600"></textarea>
                    
                    <div class="flex items-center justify-between border-t pt-2">
                        <label class="cursor-pointer flex items-center space-x-2 space-x-reverse text-gray-600 text-xs font-semibold">
                            <i class="fa-solid fa-image text-green-600 text-lg"></i>
                            <span id="fileLabel">تصویر / ویڈیو منتخب کریں</span>
                            <input type="file" id="postMedia" accept="image/*,video/*" class="hidden" onchange="document.getElementById('fileLabel').innerText=this.files[0].name">
                        </label>
                        <button type="submit" id="submitBtn" class="bg-green-700 text-white px-5 py-1.5 rounded-md font-semibold text-xs">شائع کریں</button>
                    </div>
                </form>
            </div>

            <div id="loading" class="text-center py-6 text-gray-500 font-semibold">پوسٹس لوڈ ہو رہی ہیں...</div>
            <div id="feedPosts" class="space-y-4"></div>
        </div>

        <!-- About Tab -->
        <div id="sec-about" class="hidden">
            <div class="bg-white rounded-lg shadow p-5 border border-gray-200">
                <h3 class="font-bold text-lg text-gray-900 border-b pb-2 mb-3">سرکاری تصدیق و تعارف</h3>
                <p class="text-sm text-gray-700">یہ فاؤنڈیشن ہماری بستی بلوچاں والی کی فلاح و بہبود، تعلیمی اور صحتی تعاون کے لیے قائم کی گئی ہے۔</p>
            </div>
        </div>

        <!-- Rules Tab -->
        <div id="sec-rules" class="hidden">
            <div class="bg-white rounded-lg shadow p-5 border border-gray-200">
                <h3 class="font-bold text-lg text-green-800 border-b pb-2 mb-3 text-center">انتظامیہ کے 3 بنیادی اصول</h3>
                <p class="text-sm text-gray-700">1. اخلاص (رضائے الٰہی)<br>2. بلا تفریق انصاف<br>3. صبر اور برداشت</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xyjlqphisqakfpnmiuqo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_bZ51g0UM-u_etT6hPRzrMA_cf2ab2im";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tabName) {
            document.getElementById('sec-posts').classList.add('hidden');
            document.getElementById('sec-about').classList.add('hidden');
            document.getElementById('sec-rules').classList.add('hidden');
            document.getElementById('sec-' + tabName).classList.remove('hidden');
        }

        async function fetchPosts() {
            const loading = document.getElementById('loading');
            const postsContainer = document.getElementById('feedPosts');
            
            const { data: posts, error } = await supabaseClient.from('posts').select('*').order('id', { ascending: false });
            loading.style.display = 'none';

            if (error) { postsContainer.innerHTML = `<p class="text-center text-red-500 text-xs">پوسٹس لوڈ کرنے میں مسئلہ آیا۔</p>`; return; }

            postsContainer.innerHTML = '';
            for (let post of posts) {
                // Fetch comments count
                const { data: comments } = await supabaseClient.from('comments').select('*').eq('post_id', post.id);
                const commentsCount = comments ? comments.length : 0;

                const postCard = document.createElement('div');
                postCard.className = "bg-white rounded-lg shadow border border-gray-200 overflow-hidden mb-4";

                let mediaHTML = '';
                if (post.media_url) {
                    if (post.media_type === 'video') {
                        mediaHTML = `<video controls class="w-full max-h-96 object-cover bg-black"><source src="${post.media_url}"></video>`;
                    } else {
                        mediaHTML = `<img src="${post.media_url}" class="w-full max-h-96 object-cover">`;
                    }
                }

                let commentsListHTML = '';
                if (comments && comments.length > 0) {
                    commentsListHTML = comments.map(c => `
                        <div class="bg-gray-100 p-2 rounded-lg text-xs mb-1">
                            <span class="font-bold text-gray-800">${c.user_name}:</span> <span>${c.comment_text}</span>
                        </div>
                    `).join('');
                }

                postCard.innerHTML = `
                    <div class="p-4 flex items-center space-x-3 space-x-reverse border-b border-gray-100">
                        <div class="w-10 h-10 rounded-full bg-green-100 text-green-700 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-gray-900">${post.title}</h4>
                            <p class="text-[11px] text-gray-500">${new Date(post.created_at || Date.now()).toLocaleString('ur-PK')}</p>
                        </div>
                    </div>
                    ${mediaHTML}
                    <div class="p-4 text-sm text-gray-800"><p>${post.content || ''}</p></div>

                    <!-- Like / Comment / Share Bar -->
                    <div class="border-t border-gray-100 px-2 py-2 flex justify-around text-gray-600 text-xs font-semibold bg-gray-50">
                        <button onclick="likePost(${post.id}, ${post.likes_count || 0})" class="flex items-center space-x-1 space-x-reverse hover:text-green-700">
                            <i class="fa-regular fa-thumbs-up text-base"></i>
                            <span>لائک (${post.likes_count || 0})</span>
                        </button>
                        <button onclick="toggleCommentBox(${post.id})" class="flex items-center space-x-1 space-x-reverse hover:text-green-700">
                            <i class="fa-regular fa-comment text-base"></i>
                            <span>کمنٹ (${commentsCount})</span>
                        </button>
                        <button onclick="sharePost('${post.title}')" class="flex items-center space-x-1 space-x-reverse hover:text-green-700">
                            <i class="fa-solid fa-share text-base"></i>
                            <span>شیئر</span>
                        </button>
                    </div>

                    <!-- Comments Section -->
                    <div id="comment-sec-${post.id}" class="hidden p-3 border-t bg-gray-50">
                        <div id="comments-list-${post.id}" class="mb-2">${commentsListHTML}</div>
                        <div class="flex space-x-2 space-x-reverse">
                            <input type="text" id="c-name-${post.id}" placeholder="نام" class="w-1/3 border rounded p-1 text-xs">
                            <input type="text" id="c-text-${post.id}" placeholder="کمنٹ لکھیں..." class="w-2/3 border rounded p-1 text-xs">
                            <button onclick="addComment(${post.id})" class="bg-green-700 text-white px-3 py-1 rounded text-xs">بھیجیں</button>
                        </div>
                    </div>
                `;
                postsContainer.appendChild(postCard);
            }
        }

        async function likePost(postId, currentLikes) {
            const { error } = await supabaseClient.from('posts').update({ likes_count: currentLikes + 1 }).eq('id', postId);
            if (!error) fetchPosts();
        }

        function toggleCommentBox(postId) {
            const box = document.getElementById(`comment-sec-${postId}`);
            box.classList.toggle('hidden');
        }

        async function addComment(postId) {
            const name = document.getElementById(`c-name-${postId}`).value || 'گمنام';
            const text = document.getElementById(`c-text-${postId}`).value;
            if (!text) return;

            const { error } = await supabaseClient.from('comments').insert([{ post_id: postId, user_name: name, comment_text: text }]);
            if (!error) fetchPosts();
        }

        function sharePost(title) {
            const url = window.location.href;
            const text = `اتحاد ویلفیئر فاؤنڈیشن پورٹل پر پوسٹ دیکھیں: "${title}"\n${url}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }

        async function handlePostSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const title = document.getElementById('postTitle').value;
            const text = document.getElementById('postText').value;
            const file = document.getElementById('postMedia').files[0];

            submitBtn.disabled = true;
            submitBtn.innerText = "اپ لوڈ ہو رہا ہے...";

            let media_url = null, media_type = null;
            if (file) {
                const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
                const { error: storageError } = await supabaseClient.storage.from('media').upload(fileName, file);
                if (!storageError) {
                    media_url = supabaseClient.storage.from('media').getPublicUrl(fileName).data.publicUrl;
                    media_type = file.type.startsWith('video/') ? 'video' : 'image';
                }
            }

            await supabaseClient.from('posts').insert([{ title: title, content: text, media_url: media_url, media_type: media_type }]);
            document.getElementById('postForm').reset();
            submitBtn.disabled = false;
            submitBtn.innerText = "شائع کریں";
            fetchPosts();
        }

        fetchPosts();
    </script>
</body>
</html>
